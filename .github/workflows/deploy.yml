name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
        env:
          VITE_BACKEND_URL: ${{ vars.VITE_BACKEND_URL }}
          VITE_STRIPE_PAYMENT_LINK: ${{ vars.VITE_STRIPE_PAYMENT_LINK }}
          # Preview launch on the project path: no orders or sign-ups, hash URLs.
          # Once ranchcuts.com points here: VITE_BASE=/ and drop VITE_HASH_ROUTER.
          VITE_PREVIEW: ${{ vars.VITE_PREVIEW || '1' }}
          VITE_BASE: ${{ vars.VITE_BASE || '/ranch-cuts/' }}
          VITE_HASH_ROUTER: ${{ vars.VITE_HASH_ROUTER || '1' }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
